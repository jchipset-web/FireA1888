<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 620" fill="none" className="w-full h-full">
  <defs>
    <!-- Subtle gradient matching the screenshot muted blue tint -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="quadTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="quadTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="quadBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>

    <!-- Arched text paths -->
    <path id="textArcTop" d="M 80 160 A 240 240 0 0 1 460 160" />
    <path id="textArcBottom" d="M 120 540 A 260 260 0 0 0 420 540" />
  </defs>

  <!-- Outer Large Badge Shield -->
  <path
    d="M 270 30 C 430 30 510 110 510 270 C 510 440 370 540 270 590 C 170 540 30 440 30 270 C 30 110 110 30 270 30 Z"
    stroke="#60A5FA"
    stroke-opacity="0.35"
    stroke-width="5"
    fill="url(#shieldFill)"
  />

  <!-- Inner Rim Shield Line -->
  <path
    d="M 270 50 C 410 50 485 125 485 270 C 485 425 355 520 270 568 C 185 520 55 425 55 270 C 55 125 130 50 270 50 Z"
    stroke="#93C5FD"
    stroke-opacity="0.2"
    stroke-width="2"
    stroke-dasharray="6 4"
  />

  <!-- Rivets along the rim -->
  <circle cx="270" cy="40" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="160" cy="55" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="380" cy="55" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="75" cy="120" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="465" cy="120" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="45" cy="230" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="495" cy="230" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="70" cy="350" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="470" cy="350" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="140" cy="460" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="400" cy="460" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="220" cy="540" r="3" fill="#93C5FD" fill-opacity="0.4" />
  <circle cx="320" cy="540" r="3" fill="#93C5FD" fill-opacity="0.4" />

  <!-- Top Arched Text: FOREST FIREFIGHTERS -->
  <text fill="#93C5FD" fill-opacity="0.4" font-family="'Plus Jakarta Sans', serif" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">
      FOREST FIREFIGHTERS
    </textPath>
  </text>

  <!-- Inner Quad Shield Frame -->
  <g transform="translate(145, 175)">
    <!-- Inner Shield Boundary -->
    <clipPath id="innerShieldClip">
      <path d="M 125 0 C 215 0 250 35 250 120 C 250 205 180 270 125 300 C 70 270 0 205 0 120 C 0 35 35 0 125 0 Z" />
    </clipPath>

    <!-- Clipped Quadrant Fills -->
    <g clip-path="url(#innerShieldClip)">
      <!-- Top Left Quadrant: Steam Locomotive Engine -->
      <rect x="0" y="0" width="125" height="150" fill="url(#quadTL)" />
      <!-- Top Right Quadrant: Fire Hall Building -->
      <rect x="125" y="0" width="125" height="150" fill="url(#quadTR)" />
      <!-- Bottom Half: Horses and Wagon Field -->
      <rect x="0" y="150" width="250" height="150" fill="url(#quadBot)" />

      <!-- Steam Locomotive Iconography (Top Left) -->
      <g stroke="#BAE6FD" stroke-opacity="0.4" stroke-width="2" fill="none">
        <!-- Steam Puffs -->
        <circle cx="40" cy="45" r="10" stroke-dasharray="3 2" />
        <circle cx="28" cy="55" r="7" stroke-dasharray="2 2" />
        <!-- Boiler & Smokestack -->
        <rect x="25" y="65" width="55" height="35" rx="3" fill="#0284c7" fill-opacity="0.2" />
        <rect x="35" y="50" width="10" height="15" fill="#38bdf8" fill-opacity="0.25" />
        <!-- Cab -->
        <rect x="65" y="55" width="25" height="45" fill="#0284c7" fill-opacity="0.3" />
        <rect x="70" y="60" width="15" height="15" fill="#bae6fd" fill-opacity="0.3" />
        <!-- Wheels -->
        <circle cx="35" cy="105" r="9" />
        <circle cx="55" cy="105" r="9" />
        <circle cx="75" cy="105" r="9" />
        <line x1="20" y1="114" x2="95" y2="114" stroke-width="2.5" />
      </g>

      <!-- Municipal Station 2 Building Iconography (Top Right) -->
      <g stroke="#BAE6FD" stroke-opacity="0.4" stroke-width="2" fill="none">
        <!-- Station Structure -->
        <path d="M 145 130 L 145 60 L 180 35 L 215 60 L 215 130 Z" fill="#1e3a8a" fill-opacity="0.25" />
        <!-- Bell Tower -->
        <rect x="170" y="20" width="20" height="25" fill="#3b82f6" fill-opacity="0.2" />
        <polygon points="170,20 180,8 190,20" fill="#93c5fd" fill-opacity="0.3" />
        <!-- Double Apparatus Doors -->
        <rect x="155" y="85" width="22" height="45" rx="2" fill="#0f172a" fill-opacity="0.4" />
        <rect x="183" y="85" width="22" height="45" rx="2" fill="#0f172a" fill-opacity="0.4" />
        <!-- Station Windows -->
        <rect x="155" y="65" width="12" height="12" />
        <rect x="193" y="65" width="12" height="12" />
      </g>

      <!-- Draft Horses & Vintage Brigade Wagon (Bottom Half) -->
      <g stroke="#BAE6FD" stroke-opacity="0.45" stroke-width="2" fill="none">
        <!-- Ground Line -->
        <path d="M 0 215 Q 125 210 250 215" stroke-opacity="0.25" />
        <!-- Two Horses -->
        <!-- Horse 1 (Lead) -->
        <path d="M 90 190 Q 95 175 105 175 Q 115 175 110 190 L 115 220 M 105 190 L 100 220 M 90 190 Q 75 190 65 198 L 65 220 M 75 195 L 75 220" />
        <!-- Horse 2 -->
        <path d="M 115 190 Q 120 175 130 175 Q 140 175 135 190 L 140 220 M 130 190 L 125 220 M 115 190 Q 100 190 90 198" />
        <!-- Harness & Hitch -->
        <line x1="125" y1="195" x2="160" y2="205" stroke-dasharray="3 2" />
        <!-- Wagon Body -->
        <rect x="155" y="190" width="55" height="20" rx="3" fill="#1e3a8a" fill-opacity="0.3" />
        <!-- Water Barrel / Pump Tank -->
        <ellipse cx="182" cy="188" rx="18" ry="8" fill="#0284c7" fill-opacity="0.3" />
        <!-- Spoke Wheels -->
        <circle cx="168" cy="216" r="10" />
        <circle cx="198" cy="216" r="10" />
      </g>
    </g>

    <!-- Inner Gold Shield Divider Borders -->
    <path
      d="M 125 0 C 215 0 250 35 250 120 C 250 205 180 270 125 300 C 70 270 0 205 0 120 C 0 35 35 0 125 0 Z"
      stroke="#F59E0B"
      stroke-opacity="0.5"
      stroke-width="3"
      fill="none"
    />
    <!-- Horizontal & Vertical Cross Dividers -->
    <line x1="0" y1="150" x2="250" y2="150" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="3" />
    <line x1="125" y1="0" x2="125" y2="150" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="3" />
  </g>

  <!-- Bottom Arched Text: ASSOCIATION 1888 -->
  <text fill="#93C5FD" fill-opacity="0.4" font-family="'Plus Jakarta Sans', serif" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">
      ASSOCIATION 1888
    </textPath>
  </text>
</svg>
